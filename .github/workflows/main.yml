name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cheap authoring audit ahead of the Gradle job: it needs no toolchain and fails
      # in seconds. `learning_question_coverage.py` derives a committed snapshot from the
      # two authored curricula, so a mapping or Question change that leaves the snapshot
      # stale must not merge unnoticed. --check only compares; CI never regenerates
      # content. The tooling is standard-library-only, so the runner's Python 3 is enough.
      - name: Validate learning coverage snapshot
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/learning_question_coverage.py --check

      # One Gradle invocation rather than several: a single configuration phase and
      # one Kotlin/Native + JS/Wasm toolchain setup. org.gradle.parallel is not
      # enabled, so the requested tasks run sequentially in command-line order,
      # which avoids the toolchain contention AGENTS.md warns about. Cheap Android
      # and desktop JVM compilation runs first so a plain compile break fails fast;
      # :shared:check runs last because it is by far the longest.
      #
      # Note: Kotlin/Native iOS compilations are disabled on a Linux runner, so this
      # job gives no iOS signal. iOS remains a local macOS check.
      - name: Validate Android, Desktop, and Web builds and shared tests
        run: >
          ./gradlew --no-daemon
          :androidApp:assembleDebug
          :desktopApp:assemble
          :webApp:assemble
          :shared:check

      - name: Upload JVM test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-report
          path: |
            shared/build/reports/tests/jvmTest/
            shared/build/test-results/jvmTest/
          if-no-files-found: ignore
