  - key: E10
    github_title: "EPIC-10 Mixed Android Interview"

    goal: >
      Deliver the primary interview-readiness experience by allowing users to
      take a mixed Android assessment covering multiple areas of the curriculum.
      Provide appropriate cross-topic question selection, an overall result,
      topic-level performance information, answer review, and repeat interview
      practice.

    issues:
      - key: E10-01
        title: "Implement balanced mixed interview question selection"

        issue: >
          Mixed assessments currently select from the entire active question
          pool using a global shuffle. Because curriculum topics contain
          different numbers of questions, this can over-represent larger topics
          and produce an interview that does not provide useful cross-topic
          coverage.

        approach: >
          Replace the generic Mixed selection branch with a deterministic,
          testable coverage-first round-robin policy. Randomize the eligible
          active question pool using the existing injected randomization
          boundary, group questions by topic in randomized encounter order, and
          select at most one question from each topic per round until the
          requested count is reached or the eligible pool is exhausted. Keep
          focused topic/subtopic selection unchanged.

        acceptance_criteria:
          - "AssessmentConfig.Mixed uses a cross-topic coverage-first selection policy."
          - "Only ACTIVE eligible Questions returned by CurriculumRepository participate in selection."
          - "Question IDs remain unique within one assessment."
          - "When requested count is at least the number of populated topics, every populated topic contributes one question before any topic contributes a second question."
          - "When requested count is smaller than the number of populated topics, selected questions come from distinct topics until the requested count is reached."
          - "After one coverage round, additional questions are selected through subsequent rounds while available questions remain."
          - "Topics with fewer questions are skipped cleanly once exhausted."
          - "Requested question count remains a maximum when the eligible pool is smaller."
          - "Randomization remains injectable and deterministic in tests."
          - "Focused Topic and Subtopic selection behavior is unchanged."
          - "No topic weights, difficulty weighting, historical performance weighting, or previous-attempt exclusion is introduced."
          - "Focused shared tests cover balanced coverage, sparse topics, small requested counts, exhausted topics, and oversized requested counts."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E10-02
        title: "Generalize assessment-taking presentation for focused and mixed assessments"

        issue: >
          The E09 question-taking implementation is intentionally named and
          constrained around focused practice, but Mixed interviews require the
          same session lifecycle, answer-selection UI, persistence checkpoints,
          explicit completion, and existing-attempt reconstruction. Duplicating
          that implementation would create two assessment engines at the
          presentation layer.

        approach: >
          Refactor the focused-practice presentation into a shared assessment-
          taking presentation that accepts either Focused or Mixed
          AssessmentConfig values and can also reopen an already-created
          IN_PROGRESS attempt by stable attempt ID. Preserve route-specific
          product wrappers/titles where useful while sharing the actual
          ViewModel, session state, question UI, answer submission, persistence,
          and completion behavior.

        acceptance_criteria:
          - "Focused and Mixed assessments use the same assessment-taking ViewModel/session implementation."
          - "Focused and Mixed assessments use the same single-answer and multiple-answer question UI."
          - "A new assessment launch can represent either AssessmentConfig.Focused or AssessmentConfig.Mixed."
          - "An existing persisted IN_PROGRESS attempt can be reopened through stable attempt identity."
          - "Existing-attempt loading derives and preserves the persisted AssessmentConfig rather than creating a new attempt."
          - "Answer submission continues to delegate correctness to AssessmentEngine."
          - "Initial creation, answer submission, and completion persistence checkpoints retain E09 semantics."
          - "Actual selected question count remains the UI progress total."
          - "AssessmentSession remains runtime-only and is not placed in navigation."
          - "No separate MixedInterviewEngine, MixedQuestionViewModel, or duplicated scoring implementation is introduced."
          - "All existing focused-practice behavior and tests remain valid after the refactor."
          - "Android and Desktop continue sharing the same presentation implementation."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E10-03
        title: "Implement mixed Android interview entry and launch"

        issue: >
          The application exposes focused practice through Topics, but users need
          a prominent, persistent top-level area for the primary mixed Android
          interview experience.

        approach: >
          Add a dedicated Interview area to the shared top-level navigation and
          place the prominent Mixed Android Interview action there. Use one named
          MVP interview size of 20 requested questions and navigate through a
          typed Mixed interview route carrying only primitive configuration data.
          Convert that route to AssessmentConfig.Mixed and launch it through the
          generalized shared assessment-taking presentation.

        acceptance_criteria:
          - "Shared top-level navigation exposes an Interview area with a prominent Start Mixed Interview action."
          - "The mixed interview MVP requested question count is defined once as 20."
          - "No question-count configuration wizard is introduced."
          - "Starting the interview creates AssessmentConfig.Mixed with the configured requested count."
          - "Navigation carries primitive typed route data rather than AssessmentConfig, TestAttempt, AssessmentSession, or Question objects."
          - "The mixed interview uses the same AssessmentEngine as focused practice."
          - "The balanced E10-01 selector supplies the session Questions."
          - "A successfully started Mixed attempt is persisted before its first question is treated as ready."
          - "NoEligibleQuestions is represented explicitly."
          - "Single-answer, multiple-answer, progress, save-before-advance, and explicit-completion behavior are inherited from the shared assessment presentation."
          - "Focused Topic/Subtopic entry flows continue to work unchanged."
          - "Compose and ViewModel/navigation tests cover mixed launch and no-content behavior."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E10-04
        title: "Implement mixed interview result and topic performance breakdown"

        issue: >
          A mixed interview needs more than the overall assessment score.
          Because questions span multiple curriculum areas, users need to see
          how they performed by topic while retaining the detailed answer,
          explanation, and source review established by focused practice.

        approach: >
          Implement a Mixed result route using stable attempt identity. Reuse
          the E09 historical attempt/question reconstruction and review
          presentation where practical, and derive topic-level performance from
          the completed TestAttempt plus stable historical Question identities.
          Extend CurriculumRepository with stable Topic lookup if needed so
          historical/deprecated topic names can be resolved without using active-
