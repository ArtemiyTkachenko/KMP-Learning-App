    systemic:
      - >-
        Sourcing, not authoring, is where this bank now fails. Every defect that reached
        MAJOR was a citation that no longer supported its claim, and none was a weak
        distractor or an arguable key — the two failure modes the earlier audits found.
        Vendor documentation moved underneath the bank while the bank stood still.
      - >-
        HTTP 200 is not liveness. kotlinlang.org/docs/cancellation-and-timeouts.html returns
        200 and renders nothing, and kotlinlang.org/docs/coroutines-flow.html still returns
        200 after the sections on conflation were removed. The playbook's curl loop passes
        both. Only opening the page catches either.
      - >-
        Guide pages drift; API reference pages do not. Where a question turns on a named
        parameter or a specific contract (stopTimeoutMillis, conflate vs collectLatest,
        Dispatchers.IO parallelism), the API reference is the durable citation and the
        narrative guide is the fragile one.
      - >-
        Out of scope but recorded: 14 networking questions (n 107-328) cite lysine.dev, a
        third-party mirror of Square's documentation, adopted after square.github.io began
        returning 404. A mirror is not a primary source; the canonical replacement is each
        project's own repository. InitialCurriculumContentQualityTest pins the count so the
        debt cannot grow.
