# Question bank audit log
#
# One entry per bank-wide semantic review, newest first. The rubric, statuses, severities,
# and source-verification values are defined in docs/content/question-validation.md; this
# file records results so a later session reads the verdict instead of re-deriving it.
#
# Record format for a question with findings:
#
#   - id: <question id>
#     n: <1-based position in initial_curriculum.json questions[]>
#     status: PASS | PASS_WITH_MINOR_CHANGES | FIXED | REVIEW_REQUIRED | REPLACE
#     severity: BLOCKER | MAJOR | MINOR          # highest severity found, omit for PASS
#     confidence: HIGH | MEDIUM | LOW
#     source_verification: VERIFIED | PARTIALLY_VERIFIED | UNVERIFIED | INVALID
#     failed_checks: [Q4_SINGLE_CORRECT, ...]    # rubric IDs that failed before the fix
#     issues:
#       - <concise issue description>
#     changes:
#       - <concise change description>
#
# Questions that passed without findings are rolled up by source-verification status rather
# than written out individually; a verbose record for an unchanged question is noise. Full
# records are reserved for questions that were changed or flagged.

