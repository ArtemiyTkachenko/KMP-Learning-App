name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    if: ${{ github.actor == 'ArtemiyTkachenko' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cheap authoring audit ahead of the Gradle job: it needs no toolchain and fails
      # in seconds. Two committed snapshots are derived from the authored curricula:
      # `question_bank_coverage.py` owns the marked structural regions of the question-bank
      # snapshot (its editorial prose is not checked), and `learning_question_coverage.py`
      # owns the whole learning-to-question snapshot. A content change that leaves either
      # stale must not merge unnoticed. --check only compares; CI never regenerates
      # content. The tooling is standard-library-only, so the runner's Python 3 is enough.
      - name: Validate content coverage snapshots
        run: |
          python3 -m unittest discover -s tools -p 'test_*.py'
          python3 tools/question_bank_coverage.py --check
          python3 tools/learning_question_coverage.py --check

      # Persisted attempts reference Questions and AnswerOptions by ID, so an accepted
      # revision of the bank must not remove a Question or change what an existing ID
      # means: its selectionMode, its AnswerOption IDs or its correct answers. A single
      # document cannot show that, so the gate compares the working tree against the
      # revision this change replaces — the pull request's base, the previous `main` tip
      # on push, or `main`'s parent on manual dispatch. Git history is the baseline; there
      # is no tag or release to compare against yet (docs/development/versioning.md). The
      # checkout is shallow, so the baseline commit is fetched explicitly, and a missing
      # baseline fails the step rather than skipping it.
      - name: Check question-bank identity against the replaced revision
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) baseline="$PR_BASE_SHA" ;;
            push) baseline="$PUSH_BEFORE_SHA" ;;
            workflow_dispatch)
              git fetch --no-tags --quiet --depth=2 origin main
              baseline="$(git rev-parse FETCH_HEAD~1)"
              ;;
            *)
              echo "::error::No identity baseline is defined for '$EVENT_NAME'."
              exit 1
              ;;
          esac
          if [ -z "$baseline" ] || [ "$baseline" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::No accepted revision to compare the question bank against."
            exit 1
          fi
          git fetch --no-tags --quiet --depth=1 origin "$baseline"
          python3 tools/question_bank_identity.py --against "$baseline"

      # The backlog validator is the same one `sync-backlog.yml` runs, but that workflow is
      # manual dispatch only, so before this step a malformed `backlog.yml` could merge and
      # was discovered only when someone next ran the sync — after the breakage was already
      # on `main`. Validating here makes a bad epic key, priority or size a pull-request
      # failure instead. PyYAML is pinned to the version the sync workflow installs, into a
      # virtualenv under RUNNER_TEMP: the runner's system Python is externally managed, so a
      # plain `pip install` is refused, and a virtualenv inside the workspace would be caught
      # by the uncommitted-output check below.
      - name: Validate backlog data
        run: |
          python3 -m venv "$RUNNER_TEMP/backlog-venv"
          "$RUNNER_TEMP/backlog-venv/bin/pip" install \
            --disable-pip-version-check --quiet PyYAML==6.0.3
          "$RUNNER_TEMP/backlog-venv/bin/python" \
            .github/project/validate_backlog.py .github/project/backlog.yml

      # One Gradle invocation rather than several: a single configuration phase and
      # one Kotlin/Native + JS/Wasm toolchain setup. org.gradle.parallel is not
      # enabled, so the requested tasks run sequentially in command-line order,
      # which avoids the toolchain contention AGENTS.md warns about. Cheap Android
      # and desktop JVM compilation runs first so a plain compile break fails fast;
      # :shared:check runs last because it is by far the longest.
      #
      # :androidApp:lintDebug sits next to the Android build because it reuses that
      # compilation and costs seconds. Its reach is the Android shell only — the
      # `com.android.kotlin.multiplatform.library` plugin gives :shared no main-variant
      # lint, so nothing here analyses shared Kotlin. See docs/workflows/ci.md.
      #
      # Note: Kotlin/Native iOS compilations are disabled on a Linux runner, so this
      # job gives no iOS signal. iOS remains a local macOS check.
      - name: Validate Android, Desktop, and Web builds and shared tests
        run: >
          ./gradlew --no-daemon
          :androidApp:assembleDebug
          :androidApp:lintDebug
          :desktopApp:assemble
          :webApp:assemble
          :shared:check

      # The build writes into the source tree: Room exports its schemas to
      # `shared/schemas`, which is tracked on purpose. Without this step a database
      # version bump whose schema JSON was never committed produces a green run —
      # CI regenerates the file, the migration test passes against it, and `main`
      # ends up with a schema version that exists on no machine but the runner.
      # Generated build output is gitignored, so a clean tree here is the normal case.
      - name: Verify the build left no uncommitted output
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The build created or modified files that are not committed."
            git status --porcelain
            git diff --stat
            exit 1
          fi

      # Every target :shared:check runs, not just the JVM one. Android host, JS and
      # Wasm failures are the ones least reproducible on a developer's machine, so
      # their reports are the ones most worth keeping.
      - name: Upload shared test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shared-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: ignore
