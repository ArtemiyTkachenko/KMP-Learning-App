name: Create project epics

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  create-epics:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        epic:
          - "EPIC-01 Product & Backlog Management"
          - "EPIC-02 KMP Project Foundation"
          - "EPIC-03 Engineering Workflow Foundation"
          - "EPIC-04 Android Framework Refresher"
          - "EPIC-05 Android Application Infrastructure"
          - "EPIC-06 Core Learning & Exam Domain"
          - "EPIC-07 Compose UI Migration"
          - "EPIC-08 Compose State, Lifecycle & Presentation"
          - "EPIC-09 Compose Quality, Testing & Performance"
          - "EPIC-10 Shared Domain Migration"
          - "EPIC-11 Shared Data & Networking"
          - "EPIC-12 Multiplatform Persistence"
          - "EPIC-13 Shared Presentation & Dependency Construction"
          - "EPIC-14 Compose Multiplatform UI"
          - "EPIC-15 Desktop Application"
          - "EPIC-16 Basic iOS Application"
          - "EPIC-17 CI/CD Maturation"
          - "EPIC-18 Architecture Decisions & Technical Documentation"
          - "EPIC-19 Senior Android/KMP Interview Curriculum"
          - "EPIC-20 Portfolio & Interview Case Study"

    steps:
      - name: Check whether epic exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          EPIC_TITLE: ${{ matrix.epic }}
        run: |
          EXISTS=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state all \
            --label epic \
            --limit 100 \
            --json title \
            --jq 'any(.[]; .title == env.EPIC_TITLE)')

          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"

      - name: Create epic
        if: steps.check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
          EPIC_TITLE: ${{ matrix.epic }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$EPIC_TITLE" \
            --label "epic" \
            --project "$PROJECT_TITLE" \
            --body "## Goal

          This issue represents a top-level epic for the KMP Learning App.

          ## Tracking

          Implementation work for this epic will be tracked through linked child issues.

          ## Completion criteria

          This epic is complete when its planned child issues have been completed and the relevant learning objectives have been demonstrated."
