          - "The source AssessmentConfig.Mixed is preserved."
          - "The retake receives a new stable TestAttempt ID."
          - "The retake is persisted before navigation."
          - "The retake begins IN_PROGRESS with unanswered QuestionAttempts, no score, and no completedAt timestamp."
          - "The persisted retake is reopened by stable attempt ID without AssessmentEngine.start being called a second time."
          - "The completed source attempt remains unchanged and reviewable."
          - "Fresh balanced selection is performed for the new run."
          - "Question overlap with the previous interview is permitted."
          - "SourceAttemptNotFound and NoEligibleQuestions are represented explicitly."
          - "No retake lineage fields, history-aware exclusion, or topic weighting are added."
          - "Focused tests cover successful Mixed retake, duplicate-attempt prevention, source preservation, no-content behavior, and navigation."

