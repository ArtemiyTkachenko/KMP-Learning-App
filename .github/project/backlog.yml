        acceptance_criteria:
          - "Completing a Mixed assessment persists the COMPLETED TestAttempt before result navigation."
          - "Mixed result navigation carries only stable attempt identity."
          - "Overall score uses the persisted AssessmentScore."
          - "Result review preserves persisted QuestionAttempt order and stable selected-answer identities."
          - "Selected answers, correct answers, Question correctness, explanation, and SourceReference entries remain reviewable."
          - "Topic-level performance contains stable topic ID, topic name, question count, correct count, and derived percentage."
          - "Topic-level counts are derived from the questions actually present in the completed attempt."
          - "The sum of resolvable topic question counts matches the corresponding resolved review questions."
          - "Historical Question content is resolved with CurriculumRepository.getQuestionById rather than ACTIVE-only selection APIs."
          - "Historical Topic identity can be resolved without requiring the Topic to remain ACTIVE."
          - "DEPRECATED historical Questions/Topics remain reviewable."
          - "A missing historical Question is represented explicitly and does not crash the complete result screen."
          - "Overall AssessmentScore remains authoritative even if some historical content cannot be resolved."
          - "Focused and Mixed results reuse common review models/composables where this removes real duplication."
          - "No topic statistics are persisted to Room."
          - "Focused tests cover overall score, topic grouping, multiple topics, deprecated content, missing content, answer review, explanation, and source ordering."

