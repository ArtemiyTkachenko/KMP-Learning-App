name: Agentic Claude implementation step

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      mode:
        required: true
        type: string
      iteration:
        required: true
        type: number
      position_artifact_name:
        required: true
        type: string
      review_artifact:
        required: false
        default: ""
        type: string
      commit_message:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true
    outputs:
      changed:
        value: ${{ jobs.commit.outputs.changed }}

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'IMPLEMENTATION' && 'main' || inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure comparison base exists
        run: git fetch --no-tags origin main

      - name: Exclude agent work files
        run: echo ".agent-work/" >> .git/info/exclude

      - uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: .agent-work

      - uses: actions/download-artifact@v4
        if: ${{ inputs.review_artifact != '' }}
        with:
          name: ${{ inputs.review_artifact }}
          path: .agent-work/review

      - name: Normalize Codex review
        if: ${{ inputs.review_artifact != '' }}
        run: cp .agent-work/review/*.json .agent-work/codex-review.json

      - name: Build Claude prompt
        env:
          MODE: ${{ inputs.mode }}
          ITERATION: ${{ inputs.iteration }}
        run: |
          if [ "$MODE" = "IMPLEMENTATION" ]; then
            cp .github/agentic/prompts/claude-implementer.md .agent-work/claude-prompt.md
          else
            cp .github/agentic/prompts/claude-responder.md .agent-work/claude-prompt.md
          fi
          {
            printf '\n\n## Negotiation state\n\n'
            printf 'Mode: %s\n' "$MODE"
            printf 'Negotiation iteration: %s\n' "$ITERATION"
          } >> .agent-work/claude-prompt.md

      - name: Compact Claude output schema
        id: schema
        run: echo "value=$(jq -c . .github/agentic/schemas/claude-response.json)" >> "$GITHUB_OUTPUT"

      - name: Implement or challenge with Claude
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          prompt: |
            Read `.agent-work/claude-prompt.md` and follow it exactly.
            Return only the schema-valid structured response after making any repository edits.
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Edit,Write,WebSearch,WebFetch,Bash(git diff:*),Bash(git status:*),Bash(git show:*),Bash(git log:*),Bash(./gradlew:*)"
            --json-schema '${{ steps.schema.outputs.value }}'

      - name: Save Claude position
        env:
          RESPONSE_JSON: ${{ steps.claude.outputs.structured_output }}
        run: |
          python3 - <<'PY'
          import json, os
          data = json.loads(os.environ["RESPONSE_JSON"])
          with open(".agent-work/claude-position.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write("\n")
          PY
          jq -e . .agent-work/claude-position.json >/dev/null

      - name: Build binary-safe patch
        id: patch
        env:
          MODE: ${{ inputs.mode }}
        run: |
          git diff --check
          git ls-files --others --exclude-standard -z | xargs -0 -r git add -N --

          if [ -z "$(git status --porcelain)" ]; then
            if [ "$MODE" = "IMPLEMENTATION" ]; then
              echo "Claude produced no repository changes for the initial implementation." >&2
              exit 1
            fi
            : > .agent-work/change.patch
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --binary --full-index > .agent-work/change.patch
            test -s .agent-work/change.patch
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.position_artifact_name }}
          path: .agent-work/claude-position.json
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.position_artifact_name }}-patch
          path: .agent-work/change.patch
          retention-days: 14

  commit:
    needs: claude
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'IMPLEMENTATION' && 'main' || inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.position_artifact_name }}-patch
          path: .agent-work

      - name: Apply and push trusted patch
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          MODE: ${{ inputs.mode }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          if [ ! -s .agent-work/change.patch ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$MODE" = "IMPLEMENTATION" ]; then
            git switch -c "$BRANCH"
          fi

          git apply --index --binary .agent-work/change.patch
          git diff --cached --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$COMMIT_MESSAGE"
          gh auth setup-git
          git push origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
