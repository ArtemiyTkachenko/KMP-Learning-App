    findings:
      - id: kotlin_sequence_constrained_once
        n: 43
        status: FIXED
        severity: BLOCKER
        confidence: HIGH
        source_verification: VERIFIED
        failed_checks: [Q4_SINGLE_CORRECT, Q5_CORRECT_VERIFIED, Q7_DISTRACTORS_FALSE, Q13_SOURCE_SUPPORTS_ANSWER, Q15_EXPLANATION_CORRECT]
        issues:
          - >-
            The keyed answer was false. The stem asked about the sequence { } builder, which
            kotlin-stdlib defines as `Sequence { iterator(block) }` — a fresh iterator per
            iteration, so the block re-runs and nothing throws. The distractor "runs again
            from the start" was the true answer, and the cited Sequences guide states only
            that *some* implementations constrain themselves, not that this one does.
        changes:
