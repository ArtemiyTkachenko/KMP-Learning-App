name: Agentic Codex review

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string
      iteration:
        required: true
        type: number
      final_consensus_check:
        required: false
        default: false
        type: boolean
      claude_position_artifact:
        required: true
        type: string
      previous_review_artifact:
        required: false
        default: ""
        type: string
      review_artifact_name:
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true
    outputs:
      consensus:
        value: ${{ jobs.review.outputs.consensus }}
      verdict:
        value: ${{ jobs.review.outputs.verdict }}

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      consensus: ${{ steps.gate.outputs.consensus }}
      verdict: ${{ steps.gate.outputs.verdict }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure comparison base exists
        run: git fetch --no-tags origin main

      - uses: actions/download-artifact@v4
        with:
          name: agent-task
          path: .agent-work

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.claude_position_artifact }}
          path: .agent-work/claude

      - name: Normalize Claude position
        run: cp .agent-work/claude/*.json .agent-work/claude-position.json

      - uses: actions/download-artifact@v4
        if: ${{ inputs.previous_review_artifact != '' }}
        with:
          name: ${{ inputs.previous_review_artifact }}
          path: .agent-work/previous

      - name: Normalize previous review
        if: ${{ inputs.previous_review_artifact != '' }}
        run: cp .agent-work/previous/*.json .agent-work/previous-review.json

      - name: Build reviewer prompt
        env:
          ITERATION: ${{ inputs.iteration }}
          FINAL_CHECK: ${{ inputs.final_consensus_check }}
        run: |
          cp .github/agentic/prompts/codex-reviewer.md .agent-work/review-prompt.md
          {
            printf '\n\n## Negotiation state\n\n'
            printf 'Negotiation iteration: %s\n' "$ITERATION"
            printf 'Final consensus check after iteration 5: %s\n' "$FINAL_CHECK"
          } >> .agent-work/review-prompt.md

      - name: Review with Codex
        # Pin the known-good v1.11 implementation by immutable commit. v1.12 has
        # an upstream wrapper-lifecycle hang that can leave completed Codex work
        # running indefinitely on GitHub-hosted runners.
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1.11
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          prompt-file: .agent-work/review-prompt.md
          output-schema-file: .github/agentic/schemas/codex-review.json
          output-file: .agent-work/codex-review.json
          effort: high
          codex-version: "0.157.1"
          codex-args: "--ephemeral"

      - name: Enforce consensus gate
        id: gate
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          p = Path(".agent-work/codex-review.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          active = [
              f for f in data["findings"]
              if f["status"] != "WITHDRAWN"
              and f["severity"] in {"BLOCKING", "IMPORTANT"}
          ]
          consensus = (
              data["consensus"] is True
              and data["verdict"] == "ACCEPT"
              and not active
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"consensus={'true' if consensus else 'false'}\n")
              out.write(f"verdict={data['verdict']}\n")
          if data["consensus"] and not consensus:
              print("Codex declared consensus but the structured findings still block it.")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.review_artifact_name }}
          path: .agent-work/codex-review.json
          retention-days: 14
