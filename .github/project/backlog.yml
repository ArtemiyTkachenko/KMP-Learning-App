epics:
  - key: E01
    github_title: "EPIC-01 Product & Backlog Management"

    issues:
      - key: E01-01
        title: "Define project goals and scope"

        issue: >
          Establish what the project is intended to accomplish, what we
          want to learn, and what is explicitly outside the project scope.

        approach: >
          Capture the agreed product goals, learning objectives, project
          boundaries, and explicit exclusions.

        acceptance_criteria:
          - "Project goals are defined."
          - "Primary learning objectives are defined."
          - "Project scope and explicit exclusions are defined."

        priority: "P1"
        size: "S"
        initial_status: "Done"

      - key: E01-02
        title: "Define initial epic roadmap"

        issue: >
          The project needs a high-level roadmap that separates the major
          product, Android, KMP, delivery, and learning objectives into
          manageable areas.

        approach: >
          Organize the project into top-level epics that represent coherent
          areas of work and learning.

        acceptance_criteria:
          - "The initial project roadmap is divided into agreed top-level epics."
          - "Each major project objective is represented by an epic."
          - "All 20 agreed epics exist as GitHub issues."

        priority: "P1"
        size: "S"
        initial_status: "Done"

      - key: E01-03
        title: "Configure GitHub Project workflow"

        issue: >
          The GitHub Project needs a consistent set of fields and workflow
          states for managing work throughout the project.

        approach: >
          Configure the Project with the agreed Status, Priority, Size, and
          Iteration fields and expose the native parent/sub-issue information.

        acceptance_criteria:
          - "Status supports Backlog, Ready, In Progress, and Done."
          - "Priority supports P0, P1, P2, and P3."
          - "Size supports XS, S, M, and L."
          - "An Iteration field is available for planning."
          - "Parent issue information can be displayed in the Project."

        priority: "P1"
        size: "S"
        initial_status: "Done"

      - key: E01-04
        title: "Define issue conventions and completion rules"

        issue: >
          Issues need a consistent structure so that work can be understood,
          prioritized, implemented, and evaluated without unnecessary
          project-management overhead.

        approach: >
          Establish conventions for issue identifiers, titles, descriptions,
          acceptance criteria, priorities, sizing, and workflow status.

        acceptance_criteria:
          - "Child issues use stable E##-## identifiers."
          - "Issues describe both the underlying problem and the intended approach."
          - "Acceptance criteria describe observable completion outcomes."
          - "Priority and sizing rules are defined."
          - "Ready and Done have distinct agreed meanings."

        priority: "P1"
        size: "S"
        initial_status: "Done"

      - key: E01-05
        title: "Create initial prioritized backlog"

        issue: >
          The project currently has high-level epics but needs an actionable
          near-term backlog.

        approach: >
          Refine the first project epics into appropriately scoped child issues
          with clear descriptions, acceptance criteria, priorities, and sizes.

        acceptance_criteria:
          - "EPIC-01 through EPIC-04 have an agreed initial backlog."
          - "Every child issue has a stable key."
          - "Every child issue has clear acceptance criteria."
          - "Every child issue has an assigned priority."
          - "Every child issue has an assigned size."

        priority: "P1"
        size: "M"
        initial_status: "Done"

      - key: E01-06
        title: "Plan Iteration 1"

        issue: >
          The project needs a realistic first iteration rather than attempting
          to work directly from the entire backlog.

        approach: >
          Review dependencies, priorities, and issue sizes and select a
          coherent amount of ready work for the first iteration.

        acceptance_criteria:
          - "Iteration 1 has a clearly defined goal."
          - "Selected issues are sufficiently specified to begin work."
          - "Blocking prerequisites for selected issues are resolved."
          - "Selected issues are assigned to Iteration 1."
          - "Selected issues are moved to Ready."

        priority: "P1"
        size: "S"
        initial_status: "Backlog"

      - key: E01-07
        title: "Review and refine backlog after Iteration 1"

        issue: >
          The backlog should evolve based on what is learned during actual
          implementation rather than being fully specified in advance.

        approach: >
          Review the completed iteration and use the findings to refine,
          split, reprioritize, resize, add, or remove upcoming work.

        acceptance_criteria:
          - "Iteration 1 outcomes are reviewed."
          - "Newly discovered work is represented in the backlog where appropriate."
          - "Upcoming issues are reprioritized or resized where needed."
          - "Issues that are too large are split before future iteration planning."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"


  - key: E02
    github_title: "EPIC-02 KMP Project Foundation"

    issues:
      - key: E02-01
        title: "Bootstrap Kotlin Multiplatform project"

        issue: >
          The application needs a working Kotlin Multiplatform foundation
          before shared functionality can be developed.

        approach: >
          Establish the initial KMP project structure using an intentionally
          minimal configuration that can be expanded as the project progresses.

        acceptance_criteria:
          - "The project can be built successfully from a clean checkout."
          - "The intended Kotlin Multiplatform structure exists."
          - "The Android application target builds successfully."
          - "The shared module builds successfully."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"

      - key: E02-02
        title: "Establish Android app and shared-module boundaries"

        issue: >
          The project needs clear boundaries between Android-specific code and
          code intended to be shared across platforms.

        approach: >
          Establish the initial Android application and shared-module
          responsibilities and demonstrate communication between them.

        acceptance_criteria:
          - "The Android application can consume functionality from the shared module."
          - "Android-specific code remains outside common shared source sets."
          - "The initial responsibility boundary between app and shared code is clear."
          - "The structure supports subsequent migration of domain functionality."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"

      - key: E02-03
        title: "Establish Gradle and dependency conventions"

        issue: >
          Dependency and build configuration need a consistent structure before
          additional modules and libraries are introduced.

        approach: >
          Establish centralized dependency/version management and consistent
          Gradle conventions suitable for the initial multiplatform project.

        acceptance_criteria:
          - "Dependency versions are managed consistently."
          - "Modules do not contain unnecessary duplicated version declarations."
          - "The complete project builds successfully using the agreed configuration."
          - "Adding future dependencies has a clear established pattern."

        priority: "P1"
        size: "S"
        initial_status: "Backlog"

      - key: E02-04
        title: "Establish shared test structure"

        issue: >
          Shared code needs automated test support from the beginning so that
          multiplatform domain and data logic can be developed safely.

        approach: >
          Configure the initial common test source set and add a minimal test
          that verifies the shared testing pipeline.

        acceptance_criteria:
          - "Shared tests can be executed through the normal Gradle workflow."
          - "At least one common test executes successfully."
          - "A failing shared test causes the relevant test task to fail."
          - "The test structure can be reused by subsequent shared functionality."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"

      - key: E02-05
        title: "Verify end-to-end project foundation"

        issue: >
          Individual pieces of the project foundation need to be verified
          together before feature development begins.

        approach: >
          Add a minimal piece of shared functionality, consume it from the
          Android application, and verify the complete build and test path.

        acceptance_criteria:
          - "The Android application successfully consumes shared functionality."
          - "The shared functionality is covered by an automated test."
          - "A clean project build succeeds."
          - "All foundation tests pass."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"


  - key: E03
    github_title: "EPIC-03 Engineering Workflow Foundation"

    issues:
      - key: E03-01
        title: "Establish GitHub Actions project access"

        issue: >
          GitHub Actions needs authenticated access to both the repository and
          GitHub Project before project-management automation can be built.

        approach: >
          Configure repository secrets and permissions and verify them using a
          manually triggered workflow.

        acceptance_criteria:
          - "A GitHub Actions workflow can authenticate successfully."
          - "The workflow can create a repository issue."
          - "The workflow can add the created issue to the GitHub Project."
          - "Authentication credentials are stored as GitHub Actions secrets."

        priority: "P1"
        size: "S"
        initial_status: "Done"

      - key: E03-02
        title: "Automate idempotent epic creation"

        issue: >
          Creating all project epics manually would be repetitive and would not
          exercise the GitHub Actions automation goals of the project.

        approach: >
          Use a matrix-based GitHub Actions workflow to create the agreed epics
          while checking for existing issues before creation.

        acceptance_criteria:
          - "All 20 agreed epic issues exist."
          - "All created epics are added to the GitHub Project."
          - "Epic issues use the epic label."
          - "Rerunning the workflow does not create duplicate epics."

        priority: "P1"
        size: "M"
        initial_status: "Done"

      - key: E03-03
        title: "Define version-controlled backlog schema"

        issue: >
          The project needs a maintainable representation of backlog definitions
          that is separate from the automation used to synchronize them.

        approach: >
          Define a YAML-based backlog format containing stable keys, hierarchy,
          issue descriptions, approaches, acceptance criteria, priorities,
          sizes, and initial workflow state.

        acceptance_criteria:
          - "The backlog format represents epics and their child issues."
          - "Every child issue has a stable unique key."
          - "The format supports Issue, Approach, and Acceptance criteria sections."
          - "Priority and Size are represented using the agreed values."
          - "Initial Status is distinct from mutable GitHub workflow status."
          - "Iteration is not stored as backlog-definition state."

        priority: "P1"
        size: "M"
        initial_status: "Done"

      - key: E03-04
        title: "Automate child-issue synchronization"

        issue: >
          Backlog definitions need to be reflected in GitHub without requiring
          every child issue to be created and maintained manually.

        approach: >
          Build a synchronization workflow that validates the backlog, resolves
          existing parent epics, creates or reuses child issues, and establishes
          native GitHub parent/sub-issue relationships.

        acceptance_criteria:
          - "The workflow validates backlog data before modifying GitHub."
          - "Missing child issues are created from backlog definitions."
          - "Existing child issues are reused rather than duplicated."
          - "Each child issue is attached to the correct native GitHub parent issue."
          - "Generated issue bodies contain Issue, Approach, and Acceptance criteria sections."
          - "Rerunning the workflow does not create duplicate child issues."

        priority: "P1"
        size: "L"
        initial_status: "Done"

      - key: E03-05
        title: "Automate GitHub Project field synchronization"

        issue: >
          Child issues created from the backlog also need their stable planning
          metadata represented consistently in the GitHub Project.

        approach: >
          Extend backlog synchronization to resolve Project fields dynamically
          and apply the configured Priority, Size, and initial Status values.

        acceptance_criteria:
          - "Every synchronized issue is added to the GitHub Project."
          - "Priority is synchronized from backlog.yml."
          - "Size is synchronized from backlog.yml."
          - "Initial Status is applied when a new issue is created."
          - "Existing mutable Status values are not reset by later synchronization."
          - "Iteration values are not modified by backlog synchronization."

        priority: "P1"
        size: "M"
        initial_status: "In Progress"

      - key: E03-06
        title: "Establish pull-request CI"

        issue: >
          Code changes need automated validation before they can be considered
          complete and merged into the main codebase.

        approach: >
          Configure a GitHub Actions workflow that runs the agreed build and
          automated test checks for pull requests.

        acceptance_criteria:
          - "Pull requests automatically trigger CI."
          - "The project build runs in CI."
          - "Relevant automated tests run in CI."
          - "A failing build or automated test produces a failed CI result."
          - "A successful CI run demonstrates that the branch satisfies the automated checks."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"

      - key: E03-07
        title: "Establish main-branch integration rules"

        issue: >
          The project needs a lightweight and consistent rule for how completed
          work enters the main codebase.

        approach: >
          Adopt a pull-request-based integration workflow in which completed
          changes are reviewed against acceptance criteria and validated by CI
          before merge.

        acceptance_criteria:
          - "Normal implementation work is integrated through pull requests."
          - "Relevant automated CI checks pass before work is considered Done."
          - "Merged work satisfies the issue acceptance criteria."
          - "The project's Done definition reflects successful integration into the main codebase."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"

      - key: E03-08
        title: "Add automatic pull-request code review"

        issue: >
          Pull requests currently have automated build and test validation,
          but they do not receive a guaranteed automated semantic code review.
          The repository should automatically request at least one Codex review
          for every pull request entering the normal review workflow.

        approach: >
          Configure the repository's Codex GitHub integration so that every
          non-draft pull request receives an automatic review when it is opened,
          or when it becomes ready for review if GitHub/Codex uses the
          draft-to-ready transition as the supported trigger. Keep manual
          @codex review available for additional review passes after substantial
          changes. Treat Codex review as advisory initially while retaining the
          existing deterministic Build and test CI check as the required merge
          gate.

        acceptance_criteria:
          - "Codex automatic pull-request review is enabled for the repository."
          - "Every non-draft pull request receives at least one automatic Codex review without requiring a manual @codex review command."
          - "If a pull request is created as a draft, an automatic review is triggered when it becomes ready for review where supported by Codex."
          - "Manual @codex review remains available for additional review passes."
          - "Automated Codex review remains advisory and is not initially configured as a required merge check."
          - "The existing Build and test CI check remains the required deterministic merge gate."
          - "The automatic review uses the repository's existing project and agent guidance where supported."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"


  - key: E04
    github_title: "EPIC-04 Android Framework Refresher"

    issues:
      - key: E04-01
        title: "Refresh Fragment architecture and lifecycle"

        issue: >
          Although the project will primarily use Compose, understanding
          Fragments remains useful for working with existing Android
          applications, hybrid View/Compose codebases, and migration scenarios.
          The main refresher need is understanding Fragment architecture and
          the distinction between the Fragment lifecycle and its View lifecycle.

        approach: >
          Review Fragment architecture conceptually rather than building a
          substantial Fragment-based feature. Focus on lifecycle behavior,
          FragmentManager and navigation concepts, View lifecycle ownership,
          ViewModel scoping, state restoration, communication patterns, and
          the common lifecycle mistakes encountered in production Android
          applications. Relate these concepts to modern Compose-first
          application architecture where appropriate.

        acceptance_criteria:
          - "The purpose and responsibilities of a Fragment can be explained."
          - "The difference between the Fragment lifecycle and Fragment View lifecycle can be explained."
          - "The significance of onCreateView, onViewCreated, and onDestroyView is understood."
          - "The reasons for clearing ViewBinding references when the Fragment View is destroyed are understood."
          - "Lifecycle-aware state collection using the Fragment View lifecycle is understood."
          - "FragmentManager, transactions, and back-stack behavior are understood conceptually."
          - "Fragment-scoped and Activity-scoped ViewModel use cases can be distinguished."
          - "Common Fragment lifecycle bugs and their causes can be identified."
          - "The role of Fragments in hybrid View/Compose applications and Compose migration can be explained."
          - "The situations in which a Compose-first screen does not require a Fragment are understood."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"

      - key: E04-03
        title: "Refresh Views and RecyclerView fundamentals"

        issue: >
          Compose replaces much of the classic Android View-based UI stack,
          but knowledge of Views and RecyclerView remains important when
          maintaining existing Android applications, reviewing legacy code,
          or integrating Compose into an established View-based codebase.

        approach: >
          Review the classic Android View model with particular emphasis on
          RecyclerView. Focus on XML layouts, ViewBinding, RecyclerView,
          Adapter and ViewHolder responsibilities, recycling behavior,
          ListAdapter and DiffUtil, multiple view types, event handling, and
          the conceptual relationship between RecyclerView and Compose lazy
          lists. Treat this as a theory-focused refresher rather than building
          a substantial legacy UI implementation.

        acceptance_criteria:
          - "The basic relationship between XML layouts, Views, and ViewBinding can be explained."
          - "The responsibilities of RecyclerView, Adapter, ViewHolder, and LayoutManager can be explained."
          - "The purpose of ViewHolder recycling and its implications for binding state are understood."
          - "The risks of relying on stale adapter positions are understood."
          - "The roles of DiffUtil, ListAdapter, and immutable list updates can be explained."
          - "The difference between areItemsTheSame and areContentsTheSame can be explained."
          - "Multiple RecyclerView view types and common event-propagation patterns are understood."
          - "Common RecyclerView state and recycling bugs can be identified."
          - "The conceptual differences between RecyclerView and Compose LazyColumn/LazyRow are understood."
          - "Basic View and Compose interoperability using ComposeView and AndroidView can be explained."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"


  - key: E05
    github_title: "EPIC-05 KMP Application Shell & Navigation"

    goal: >
      Establish the KMP-first application shell that will host the interview
      preparation product. Define the top-level application structure,
      navigation model, application composition, and mobile-oriented execution
      path while keeping Android as the primary development and validation
      platform.

    issues:
      - key: E05-01
        title: "Establish shared application root and mobile shell"

        issue: >
          The project has a working Kotlin Multiplatform foundation but needs
          a durable shared application root before product features are added.
          Platform entry points should remain thin while the normal application
          UI and application-level composition live in shared code.

        approach: >
          Establish a shared App entry point using Compose Multiplatform and
          Material 3. Configure the basic mobile-oriented application container
          and shared resource usage while keeping Android as the primary
          execution target. Keep platform modules responsible only for the
          platform-specific bootstrap required to host the shared application.

        acceptance_criteria:
          - "A shared Compose Multiplatform App entry point exists."
          - "The Android application launches the shared App entry point."
          - "Normal application UI composition lives in shared code rather than the Android platform module."
          - "Material 3 is established as the application UI component baseline."
          - "Compose Multiplatform Resources can be used from shared UI code."
          - "The application shell assumes a mobile layout without introducing tablet or desktop-specific UI patterns."
          - "No interview-preparation feature implementation is introduced as part of the shell."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E05-02
        title: "Establish Navigation 3 and typed routes"

        issue: >
          The application needs a shared navigation foundation before product
          journeys can be implemented. Navigation should be type-safe,
          compatible with Kotlin Multiplatform, and owned explicitly by the
          application rather than relying on string route identifiers.

        approach: >
          Introduce Navigation 3 in shared code. Define a small typed route
          hierarchy using NavKey and kotlinx.serialization, establish the
          application-owned back stack and NavDisplay, and add only the
          placeholder destinations necessary to demonstrate forward and back
          navigation. Keep the route model independent of unfinished product
          domain implementations.

        acceptance_criteria:
          - "Navigation 3 is configured in shared application code."
          - "Navigation destinations are represented by typed NavKey objects rather than string route identifiers."
          - "The initial route hierarchy supports serialization using kotlinx.serialization."
          - "The application owns and manages its navigation back stack explicitly."
          - "NavDisplay renders destinations from the shared navigation state."
          - "Forward navigation between at least two placeholder destinations works."
          - "Back navigation returns to the previous destination correctly."
          - "The navigation implementation does not introduce Decompose, Voyager, or another competing navigation framework."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E05-03
        title: "Establish shared presentation state and lifecycle conventions"

        issue: >
          Shared screens need a consistent presentation-state model before
          feature development begins. ViewModels must also have predictable
          lifecycle ownership when used with Navigation 3.

        approach: >
          Establish the shared presentation pattern using multiplatform
          AndroidX ViewModel, immutable UI state exposed through StateFlow,
          lifecycle-aware Compose state collection, and navigation-entry
          ViewModel scoping. Demonstrate the pattern with the smallest useful
          state interaction rather than implementing real product behavior.

        acceptance_criteria:
          - "Multiplatform AndroidX ViewModel can be used from shared application code."
          - "The established presentation pattern exposes immutable UI state through StateFlow."
          - "Shared Compose UI collects ViewModel state using lifecycle-aware collection."
          - "Navigation 3 entry decorators required for navigation-entry ViewModel scoping are configured."
          - "A ViewModel associated with a destination has lifecycle ownership tied to the intended navigation entry."
          - "A minimal state-changing interaction demonstrates the ViewModel-to-UI state flow."
          - "The example does not introduce unfinished interview domain or persistence behavior."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E05-04
        title: "Establish application composition boundary"

        issue: >
          Future features will introduce repositories, persistence, assessment
          services, and other dependencies. The application needs a clear
          composition boundary before those dependencies appear, without
          prematurely introducing a dependency-injection framework.

        approach: >
          Define where application-level dependencies are constructed and how
          they are supplied to shared presentation and domain components.
          Prefer explicit constructor injection for the current dependency
          graph. Record Koin as the intended dependency-injection framework if
          a real dependency graph later justifies it, but do not introduce Koin
          solely to satisfy this issue.

        acceptance_criteria:
          - "The application has a clear composition point for constructing and supplying shared dependencies."
          - "Dependencies used by presentation components can be supplied through explicit constructor injection."
          - "Shared components do not obtain dependencies through hidden global mutable state."
          - "No dependency-injection framework is introduced without a concrete dependency graph that requires it."
          - "The intended future use of Koin, and the reason for deferring its introduction, is documented in accordance with the repository decision-documentation rules."
          - "The composition structure can accommodate future repositories and domain services without changing platform entry-point responsibilities."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"


      - key: E05-05
        title: "Verify end-to-end KMP application shell"

        issue: >
          The application-shell pieces need to be verified together before
          product-domain and data work begins. Individual setup tasks are not
          sufficient if navigation, lifecycle, presentation state, and platform
          integration do not operate coherently.

        approach: >
          Verify the complete application path from a platform entry point into
          the shared App, through Navigation 3, a navigation-scoped ViewModel,
          StateFlow-backed presentation state, and shared Compose UI. Use
          Android as the primary runtime validation target while ensuring that
          other existing KMP targets remain buildable where currently supported.

        acceptance_criteria:
          - "The Android application launches successfully into the shared application shell."
          - "The shared application can navigate between the established placeholder destinations."
          - "Destination presentation state is provided by a shared navigation-scoped ViewModel."
          - "State updates are reflected correctly in shared Compose UI."
          - "Back navigation behaves correctly after state interaction."
          - "A clean build and the relevant automated tests pass."
          - "Existing non-Android KMP targets remain buildable where they were supported before this epic."
          - "No persistence, networking, curriculum content, or assessment-domain implementation is required to complete the application shell."

        priority: "P2"
        size: "S"
        initial_status: "Backlog"


  - key: E06
    github_title: "EPIC-06 Android Interview Curriculum & Content"

    goal: >
      Define the structured Android interview curriculum and the content model
      used by the application. Establish topics, subtopics, questions, answer
      options, correct answers, explanations, authoritative sources, and stable
      content identities suitable for bundled application content.

    issues:
      - key: E06-01
        title: "Define MVP Android interview curriculum"

        issue: >
          The interview-preparation product needs an agreed curriculum before
          questions can be authored or persisted. Without a defined taxonomy,
          content risks becoming an unstructured collection of questions with
          inconsistent coverage and no reliable basis for focused practice,
          mixed interviews, or progress reporting.

        approach: >
          Define the MVP Android interview curriculum as a hierarchy of topics
          and subtopics representing the areas expected in modern senior Android
          interviews. Keep the taxonomy focused enough for the MVP while making
          the boundaries clear enough for later question selection, focused
          practice, mixed assessments, and topic-level statistics.

        acceptance_criteria:
          - "An agreed set of MVP Android interview topics is defined."
          - "Each topic contains one or more clearly scoped subtopics."
          - "Topic and subtopic boundaries avoid unnecessary overlap where practical."
          - "The curriculum covers the major technical areas relevant to modern senior Android interviews."
          - "The taxonomy is suitable for focused practice, mixed interview selection, and later topic/subtopic statistics."
          - "Topics intentionally excluded from the MVP are documented where the exclusion would otherwise be ambiguous."
          - "The curriculum definition does not depend on a database schema, persistence library, or UI implementation."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E06-02
        title: "Define structured curriculum content model"

        issue: >
          Curriculum content needs a stable shared representation before it can
          be authored, validated, imported, persisted, or consumed by the
          assessment engine. The representation must preserve content identity
          independently from mutable display text.

        approach: >
          Define common KMP content models for the curriculum hierarchy and
          interview questions. Represent topics, subtopics, questions, answer
          options, the correct answer, explanations, authoritative source
          references, optional difficulty metadata, and content lifecycle state.
          Establish explicit stable identity rules without coupling the model to
          a database or runtime persistence representation.

        acceptance_criteria:
          - "Shared models represent Topic, Subtopic, Question, AnswerOption, and authoritative SourceReference concepts."
          - "A Question belongs unambiguously to the appropriate curriculum topic/subtopic."
          - "Questions support multiple answer options and exactly one correct answer for the MVP."
          - "Questions contain an explanation suitable for answer review."
          - "Questions support one or more authoritative source references."
          - "Difficulty metadata is optional and does not affect core question validity."
          - "Topic, Subtopic, and Question have stable identities that are independent of display names and wording."
          - "The content model can distinguish active content from deprecated content without requiring deletion."
          - "The model is defined in shared/common KMP code and contains no Android-specific dependencies."
          - "The model does not define database entities, persistence annotations, repository interfaces, or import mechanics."
          - "Meaningful model invariants are covered by focused shared tests where appropriate."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E06-03
        title: "Define interview content authoring and quality standards"

        issue: >
          A structurally valid question can still be poor interview-preparation
          content. The project needs lightweight authoring standards so that the
          question bank remains technically accurate, understandable, reviewable,
          and consistently sourced as it grows.

        approach: >
          Document concise rules for writing questions, answer options,
          explanations, and references. Prefer official Android, Kotlin,
          Jetpack, Gradle, and Kotlin Multiplatform documentation where an
          authoritative primary source exists. Define expectations for ambiguity,
          distractors, explanation quality, source relevance, and content
          freshness without building a heavyweight editorial process.

        acceptance_criteria:
          - "Question-writing guidelines define what constitutes a clear and answerable MVP question."
          - "Incorrect answer options should be plausible without relying on deliberate ambiguity or trick wording."
          - "Explanations state why the correct answer is correct and clarify important misconceptions where useful."
          - "Official primary documentation is preferred as the authoritative source where available."
          - "Source references must support the technical claim being tested rather than merely reference the general topic."
          - "Rules exist for identifying content that has become outdated or deprecated."
          - "The standards distinguish technical content quality from application storage or import concerns."
          - "The guidelines are stored in a durable repository document suitable for future contributors and AI-assisted content authoring."

        priority: "P1"
        size: "S"
        initial_status: "Backlog"


      - key: E06-04
        title: "Create initial Android interview question bank"

        issue: >
          The application needs real interview content before the later data,
          assessment, and learning journeys can be implemented meaningfully.
          Placeholder questions would not exercise curriculum coverage,
          explanations, sourcing, or question-selection behavior realistically.

        approach: >
          Author an initial MVP question bank using the agreed curriculum,
          structured content model, and authoring standards. Distribute
          questions across the agreed topics and subtopics rather than heavily
          concentrating them in one area. Include stable IDs, answer options,
          correct answers, explanations, and authoritative source references for
          every question. Keep the amount of content sufficient for development
          and realistic practice without attempting to create an exhaustive
          interview database in this issue.

        acceptance_criteria:
          - "Every agreed MVP topic has representative interview questions."
          - "The initial question bank covers the agreed subtopics sufficiently to exercise focused and mixed practice flows."
          - "Every question has a stable question identity."
          - "Every question contains multiple answer options and one or more correct answers."
          - "Questions with multiple correct answers clearly indicate that multiple selections are required."
          - "Every question contains an explanation."
          - "Every question contains at least one authoritative source reference."
          - "Question wording and explanations follow the agreed authoring standards."
          - "The initial bank contains enough cross-topic content to support meaningful implementation and testing of later focused and mixed assessment features."
          - "Content remains bundled/version-controlled project content rather than runtime database seed implementation."
          - "No backend, network source, or AI-generated-at-runtime content mechanism is introduced."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E06-05
        title: "Validate curriculum content readiness"

        issue: >
          Before E07 builds import and persistence around the curriculum, the
          content definitions need to be checked as a coherent dataset.
          Invalid identities, broken hierarchy references, malformed answer
          definitions, or missing sources should be caught before persistence
          code depends on them.

        approach: >
          Establish deterministic validation for the structured curriculum and
          run it against the complete initial question bank. Validate identities,
          hierarchy relationships, question invariants, source requirements,
          lifecycle metadata, and minimum curriculum coverage. Keep validation
          independent from the future database/import implementation so E07 can
          reuse or invoke the same content rules.

        acceptance_criteria:
          - "Topic, Subtopic, and Question identities are unique within the bundled curriculum."
          - "Every subtopic belongs to a valid topic."
          - "Every question belongs to a valid curriculum location."
          - "Every question has the required answer options and one or more valid correct answers."
          - "Every question has a non-empty explanation."
          - "Every active question has at least one valid authoritative source reference."
          - "Deprecated content can remain structurally valid without being treated as active practice content."
          - "Validation detects malformed curriculum content deterministically."
          - "The complete initial bundled curriculum passes validation."
          - "The validation rules are covered by focused shared automated tests."
          - "Validation does not require a database, repository, or E07 import implementation."

        priority: "P2"
        size: "M"
        initial_status: "Backlog"


  - key: E07
    github_title: "EPIC-07 Local Data & Content Import"

    goal: >
      Establish the local-first data layer for the application. Support
      importing bundled structured interview content into local persistence,
      validating that content, and providing the runtime data access required
      by the rest of the application without introducing networking or backend
      dependencies.

    issues:
      - key: E07-01
        title: "Select persistence approach and define local data schema"

        issue: >
          The application needs a multiplatform persistence solution and an
          explicit relational representation of the curriculum before database
          implementation begins. Choosing a library without first considering
          the data-access requirements and KMP boundaries could introduce
          unnecessary complexity or constrain later assessment features.

        approach: >
          Compare Room KMP and SQLDelight against the needs of this project,
          including Android relevance, KMP support, relational-query support,
          testability, migrations, tooling, and platform-specific setup.
          Select the persistence technology and define the initial local schema
          for topics, subtopics, questions, answer options, source references,
          and content lifecycle state. Preserve the stable identities introduced
          in E06 and keep persistence concerns separate from the curriculum
          domain models.

        acceptance_criteria:
          - "Room KMP and SQLDelight are compared against the project's concrete persistence requirements."
          - "One persistence technology is selected and the rationale is documented."
          - "The initial relational schema represents topics, subtopics, questions, answer options, source references, and content status."
          - "Stable curriculum IDs remain the authoritative identities rather than database-generated content identities."
          - "Question-to-topic and question-to-subtopic relationships can be represented and queried directly."
          - "A question can persist one or more correct answer IDs."
          - "The schema supports retaining deprecated content without requiring deletion."
          - "The design supports later persistence of assessment history without implementing that history in this issue."
          - "Platform-specific database creation boundaries are identified where required by the selected KMP library."
          - "No database implementation, repository implementation, or import flow is added in this issue."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E07-02
        title: "Introduce bundled curriculum serialization"

        issue: >
          The initial curriculum currently exists as Kotlin source declarations.
          The application needs a portable bundled-content representation before
          content can be imported through the same path that future curriculum
          updates will use.

        approach: >
          Introduce kotlinx.serialization for curriculum content and represent
          the approved curriculum/question bank as bundled structured JSON.
          Deserialize the bundled content into the existing E06 Curriculum
          domain model and validate the result using CurriculumValidator.
          Keep serialization separate from database persistence.

        acceptance_criteria:
          - "The curriculum content model can be serialized and deserialized using kotlinx.serialization."
          - "The existing initial curriculum is represented as version-controlled bundled JSON content."
          - "Bundled content deserializes into the existing Curriculum domain model."
          - "Deserialized bundled content passes CurriculumValidator."
          - "All existing stable Topic, Subtopic, Question, and AnswerOption identities are preserved."
          - "Multiple-correct-answer questions remain representable."
          - "ContentStatus values are preserved by serialization."
          - "The Kotlin-authored E06 question bank is removed or reduced so there is one authoritative bundled curriculum source."
          - "Serialization does not depend on a database, repository, Android-only API, network source, or backend."
          - "Malformed serialized content is covered by focused tests where appropriate."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E07-03
        title: "Implement local curriculum database"

        issue: >
          Validated curriculum content needs durable local persistence before
          the application can query it independently from the bundled source
          representation.

        approach: >
          Implement the selected E07-01 database technology in the shared KMP
          data layer. Define the database tables/entities and mappings required
          for curriculum content, establish required relationships and indexes,
          and provide the minimum database queries needed to persist and inspect
          curriculum data. Keep domain models distinct from persistence models
          where that separation provides a useful boundary.

        acceptance_criteria:
          - "The selected persistence library is configured for the current KMP targets."
          - "Topics, subtopics, questions, answer options, source references, correct-answer relationships, and content status can be persisted."
          - "Stable curriculum IDs are preserved in local persistence."
          - "The database enforces or supports the intended relational hierarchy where appropriate."
          - "Useful indexes are defined for expected topic, subtopic, question, and status queries."
          - "Database creation works for the Android application."
          - "Existing retained desktop/web development targets remain buildable where supported by the selected database approach."
          - "Database schema or migration artifacts required by the selected library are version controlled."
          - "Focused persistence tests verify representative inserts and reads."
          - "No bundled-content import orchestration or repository API is implemented yet."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E07-04
        title: "Implement validated curriculum import and update flow"

        issue: >
          Bundled curriculum data must be imported into local persistence in a
          deterministic way that supports first-run setup and later bundled
          content updates without losing stable content identity.

        approach: >
          Implement the local import pipeline from bundled serialized curriculum
          through deserialization and CurriculumValidator into the database.
          Use stable IDs to insert or update content deterministically. Preserve
          deprecated records so historical references can remain meaningful and
          make repeated imports safe.

        acceptance_criteria:
          - "Bundled curriculum content is deserialized before persistence."
          - "CurriculumValidator runs before any imported curriculum is accepted."
          - "Invalid bundled curriculum is not partially persisted."
          - "A fresh database can be populated from the bundled curriculum."
          - "Repeated import of unchanged bundled content is idempotent."
          - "Existing content is updated by stable identity rather than duplicated."
          - "New bundled content can be inserted without resetting unrelated existing data."
          - "Content marked DEPRECATED remains persisted and distinguishable from ACTIVE content."
          - "The import flow does not silently delete curriculum content solely because it is no longer active."
          - "Focused tests cover first import, repeat import, update behavior, malformed content, and deprecated content."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E07-05
        title: "Expose curriculum repositories and runtime queries"

        issue: >
          Later assessment and learning features need a stable application-facing
          API for accessing curriculum content without depending directly on
          database implementation details.

        approach: >
          Introduce shared repository boundaries over the local curriculum data
          source and implement the runtime queries required by upcoming focused
          practice and assessment features. Prefer APIs expressed in domain
          models and keep persistence-specific types behind the data layer.

        acceptance_criteria:
          - "Application code can obtain active topics through a shared repository API."
          - "Application code can obtain active subtopics for a topic."
          - "Application code can obtain active questions by topic."
          - "Application code can obtain active questions by subtopic."
          - "A question can be retrieved by stable question ID."
          - "Repository results use curriculum/domain models rather than exposing database-specific entities."
          - "Deprecated content is excluded from normal active-practice queries while remaining individually retrievable where historical lookup requires it."
          - "Repository behavior is covered by focused shared tests."
          - "No assessment selection, scoring, attempt persistence, or UI behavior is implemented."
          - "Dependency wiring remains simple; Koin is introduced only if the resulting dependency graph now provides a concrete reason to use it."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E07-06
        title: "Verify end-to-end local data and content path"

        issue: >
          The serialization, validation, import, persistence, and repository
          layers need to be verified together before the assessment engine is
          built on top of them.

        approach: >
          Add integration-oriented tests and minimal application wiring needed
          to exercise the complete local-first content path from bundled
          curriculum through validation and persistence to repository queries.
          Verify failure behavior and repeat-import behavior as well as the
          successful path.

        acceptance_criteria:
          - "A fresh local database can be initialized from the bundled curriculum."
          - "The complete bundled curriculum passes validation before persistence."
          - "All expected active topics can be queried after import."
          - "Representative topic/subtopic/question queries return the expected domain content."
          - "Repeated initialization/import does not create duplicate curriculum records."
          - "Deprecated content remains stored but is excluded from normal active-content queries."
          - "Malformed bundled curriculum fails without leaving a partially imported dataset."
          - "The complete local-first content path is covered by automated tests."
          - "The Android application can initialize the local data path without networking or a backend."
          - "E07 leaves a stable runtime data boundary suitable for E08 assessment-engine development."

        priority: "P2"
        size: "M"
        initial_status: "Backlog"


  - key: E08
    github_title: "EPIC-08 Learning & Assessment Engine"

    goal: >
      Build the shared domain capabilities required to create and complete
      assessments. Support question selection, focused and mixed test
      configurations, individual question attempts, test attempts, scoring,
      completion, and retakes through a common assessment model.

    issues:
      - key: E08-01
        title: "Define shared assessment domain model"

        issue: >
          Focused practice and mixed interviews need one shared assessment
          vocabulary before selection, scoring, persistence, and UI flows are
          implemented. Without an explicit domain model, later epics risk
          creating separate focused-test and mixed-test implementations.

        approach: >
          Define the KMP-common assessment domain model for assessment
          configuration, assessment identity, question state, submitted answers,
          question results, test attempts, completion state, and scoring
          summaries. Keep the model independent from Room and UI. Represent
          focused and mixed assessments through a common configuration model
          without implementing their product-specific selection policies yet.

        acceptance_criteria:
          - "A shared assessment configuration model can represent focused and mixed assessments."
          - "Focused configuration can identify a topic or subtopic scope."
          - "Mixed configuration can represent a requested question count without embedding E10-specific balancing logic."
          - "A TestAttempt has its own stable attempt identity and represents one independent assessment run."
          - "A QuestionAttempt belongs to one TestAttempt and identifies the stable Question ID."
          - "Selected answers are represented by stable AnswerOption IDs rather than indexes."
          - "QuestionAttempt can represent unanswered and answered state where required by the engine."
          - "Assessment completion state is represented explicitly."
          - "Scoring/result models support both single-answer and multiple-answer questions."
          - "Retakes are modeled as new TestAttempt identities rather than mutation of previous history."
          - "The model lives in shared/common code and has no Room, Android, Compose, or ViewModel dependencies."
          - "Focused tests cover important model invariants and equality/value semantics."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E08-02
        title: "Implement assessment question selection"

        issue: >
          Assessment creation needs deterministic, testable selection behavior
          over the active curriculum without coupling the engine to UI or
          persistence implementation details.

        approach: >
          Implement a shared question-selection component that obtains eligible
          questions through CurriculumRepository and produces the question set
          required by an AssessmentConfig. Support focused topic/subtopic
          selection and the generic mixed-assessment input required by E10.
          Separate randomization from eligibility rules so tests can be
          deterministic. Leave sophisticated mixed-topic balancing and
          repetition avoidance to E10 unless they are truly generic primitives.

        acceptance_criteria:
          - "Focused topic selection uses active questions from CurriculumRepository."
          - "Focused subtopic selection uses active questions from CurriculumRepository."
          - "Requested question count is respected when enough eligible questions exist."
          - "Selection never returns the same Question ID twice in one assessment."
          - "Deprecated questions are not selected for new assessments."
          - "Selection behavior for a requested count greater than the eligible pool is explicit and tested."
          - "Randomization can be controlled or replaced in tests without global randomness."
          - "The selector returns domain Questions or stable question identities without exposing Room types."
          - "No scoring, attempt persistence, UI, or E10-specific topic-balancing policy is implemented."
          - "Focused shared tests cover deterministic selection and edge cases."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E08-03
        title: "Implement assessment session and scoring engine"

        issue: >
          Selected questions need one shared engine for recording answers,
          evaluating correctness, progressing through an assessment, and
          producing a final result. Focused practice and mixed interviews should
          not implement separate scoring/session logic.

        approach: >
          Implement a shared assessment engine that creates a TestAttempt from a
          selected question set, records QuestionAttempt answers using stable
          answer IDs, evaluates single- and multiple-answer questions, tracks
          completion, and calculates assessment-level scoring. Keep the engine
          pure/domain-oriented where practical and independent from Room and UI.

        acceptance_criteria:
          - "A new assessment session creates a distinct TestAttempt identity."
          - "Answers are submitted using stable AnswerOption IDs."
          - "Single-answer questions are evaluated correctly."
          - "Multiple-answer questions require the correct answer set according to the agreed scoring rule."
          - "Duplicate selected answer IDs do not incorrectly affect correctness."
          - "An answer containing an incorrect additional option is not scored as fully correct."
          - "QuestionAttempt records the submitted selection and correctness result."
          - "The engine can determine whether the assessment is complete."
          - "A completed assessment exposes total question count, correct count, and score/percentage."
          - "Completing or scoring an assessment does not mutate curriculum Questions."
          - "Focused and mixed configurations use the same assessment/session engine."
          - "Pure shared tests cover scoring, progression, completion, invalid submissions, and multiple-answer behavior."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E08-04
        title: "Persist assessment attempts and selected answers"

        issue: >
          Completed and in-progress assessment attempts must survive beyond an
          in-memory session so retakes, history, progress, and mistake review can
          be built without losing the exact questions and answers associated
          with each run.

        approach: >
          Extend the local Room schema with persistence for TestAttempt and
          QuestionAttempt plus the selected-answer identities required to
          reconstruct an attempt. Preserve the existing curriculum stable-ID
          relationships. Add mappings and a narrow attempt persistence boundary
          without implementing E11 statistics/history UI.

        acceptance_criteria:
          - "TestAttempt and QuestionAttempt are persisted as separate concepts."
          - "Each TestAttempt has a unique stable attempt ID."
          - "Each QuestionAttempt references its parent TestAttempt and stable Question ID."
          - "Selected AnswerOption IDs can be persisted for each QuestionAttempt."
          - "Multiple selected answers are representable without index-based identity."
          - "Attempt completion state and scoring fields required by the domain model are persisted."
          - "Historical attempts can continue referencing DEPRECATED curriculum questions."
          - "A new Room schema version and migration from the existing E07 schema are implemented and tested."
          - "Persistence mappings keep Room entities out of the assessment domain API."
          - "Focused persistence tests verify save/read of single-answer and multi-answer attempts."
          - "No progress aggregation, weak-area analysis, mistake-review UI, or E11 behavior is implemented."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E08-05
        title: "Implement assessment attempt repository and retake behavior"

        issue: >
          The assessment engine needs a stable persistence-facing boundary for
          saving and retrieving attempts, and retakes need explicit semantics
          that preserve prior history rather than overwriting it.

        approach: >
          Introduce an AssessmentRepository over the local attempt persistence
          layer. Support saving an attempt, retrieving an attempt by ID, and
          creating a retake as a new TestAttempt using the relevant prior
          configuration while keeping the original attempt unchanged. Keep
          broad history/statistics queries deferred to E11.

        acceptance_criteria:
          - "AssessmentRepository exposes domain models rather than Room entities."
          - "A TestAttempt can be saved and retrieved by stable attempt ID."
          - "QuestionAttempts and selected answer IDs are reconstructed correctly."
          - "Saving/updating an in-progress attempt does not create duplicate QuestionAttempt rows."
          - "A retake receives a new TestAttempt ID."
          - "The original TestAttempt remains unchanged after creating a retake."
          - "Retake preserves the assessment configuration needed to create another run."
          - "Whether a retake reuses or reselects questions is explicit and tested according to the agreed domain rule."
          - "No broad history feed, statistics aggregation, weak-area calculation, or mistake-review behavior is added."
          - "Focused repository tests cover persistence round-trip and retake identity semantics."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E08-06
        title: "Verify shared assessment engine end to end"

        issue: >
          Before focused-practice and mixed-interview product flows are built,
          the shared assessment components need to be verified together across
          curriculum access, selection, scoring, persistence, and retakes.

        approach: >
          Add integration-oriented tests exercising CurriculumRepository,
          assessment selection, the session/scoring engine, and
          AssessmentRepository together. Verify both focused and generic mixed
          configurations use the same underlying engine and that persisted
          results can be reconstructed accurately.

        acceptance_criteria:
          - "A focused assessment can be created from active persisted curriculum questions."
          - "A generic mixed assessment configuration can be created through the same assessment engine."
          - "Selected questions can be answered and the assessment completed."
          - "Single- and multiple-answer questions produce correct persisted results."
          - "A completed assessment can be persisted and reconstructed without loss of answer identity or score."
          - "A retake creates a separate persisted TestAttempt."
          - "The original attempt remains available after the retake."
          - "Deprecated questions are not selected for new assessments but remain resolvable for historical attempts."
          - "The complete engine path remains shared/common and independent from Compose UI."
          - "E08 leaves stable CurriculumRepository and AssessmentRepository boundaries ready for E09 and E10."

        priority: "P2"
        size: "M"
        initial_status: "Backlog"


  - key: E09
    github_title: "EPIC-09 Topic Study & Focused Practice"

    goal: >
      Deliver the focused learning journey in which users can browse Android
      interview topics and subtopics, start targeted tests, answer questions,
      review results and explanations, follow authoritative source references,
      and repeat focused practice.

    issues:
      - key: E09-01
        title: "Implement topic browser and real application start destination"

        issue: >
          The application still opens into the placeholder navigation flow.
          Users need a real entry point for browsing the Android interview
          curriculum before focused practice can be launched.

        approach: >
          Replace the placeholder start destination with a Compose topic browser
          backed by a shared ViewModel and CurriculumRepository. Display active
          Android interview topics using the existing persisted curriculum and
          establish the real Navigation 3 routes required to enter a topic.
          Keep the presentation KMP-common and use the existing E08 runtime
          dependency graph rather than accessing Room directly.

        acceptance_criteria:
          - "The application start destination displays ACTIVE curriculum topics from CurriculumRepository."
          - "Topic order follows the repository's authored curriculum order."
          - "Each rendered topic uses stable Topic ID identity."
          - "Selecting a topic navigates to a typed Navigation 3 topic route."
          - "Loading, content, empty, and failure states are represented explicitly in presentation state."
          - "The placeholder start/detail product flow is removed once the real topic flow replaces it."
          - "The screen is implemented in shared Compose Multiplatform code."
          - "The ViewModel depends on domain/repository boundaries rather than Room or DAO types."
          - "Focused ViewModel and Compose tests cover the main rendering/navigation states."
          - "No assessment-taking or result-review behavior is implemented yet."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E09-02
        title: "Implement subtopic browser and focused practice launch"

        issue: >
          After choosing a topic, users need to see its meaningful subtopics and
          start practice scoped either to the entire topic or to one subtopic.

        approach: >
          Implement a topic detail/subtopic browser using CurriculumRepository.
          Build presentation summaries from active subtopics and active
          questions, filtering subtopics that currently contain no eligible
          questions. Allow the user to start focused practice for either the
          whole topic or a populated subtopic using AssessmentConfig.Focused.
          Use a simple fixed MVP requested question count rather than building a
          configuration wizard.

        acceptance_criteria:
          - "The selected topic is loaded by stable topic ID."
          - "ACTIVE subtopics for the selected topic are displayed."
          - "Subtopics with zero ACTIVE eligible questions are not presented as actionable practice targets."
          - "Question availability is calculated without issuing one repository query per subtopic."
          - "The user can start topic-wide focused practice."
          - "The user can start subtopic-scoped focused practice."
          - "Focused practice uses AssessmentConfig.Focused with the correct Topic or Subtopic scope."
          - "The MVP requested question count is defined in one named place and is not duplicated as magic numbers."
          - "If no eligible questions exist for a valid scope, the presentation handles the outcome explicitly."
          - "Navigation passes stable IDs/configuration rather than Room objects or full curriculum objects."
          - "Focused tests cover topic loading, populated-subtopic filtering, scope construction, and no-content behavior."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E09-03
        title: "Implement focused assessment session and question UI"

        issue: >
          The shared assessment engine can create and score sessions, but users
          cannot yet interact with those sessions through the application.

        approach: >
          Implement the shared presentation state and Compose question-taking
          screen for a focused AssessmentSession. Start sessions through
          AssessmentEngine, show one question at a time, support single- and
          multiple-answer selection, submit answers explicitly, persist updated
          TestAttempt snapshots through AssessmentRepository, and advance
          through the session without duplicating scoring logic in the UI.

        acceptance_criteria:
          - "A focused AssessmentConfig can be started through AssessmentEngine."
          - "The screen displays the current question text and authored answer options in order."
          - "Single-answer questions allow one selected option."
          - "Multiple-answer questions allow multiple selected options."
          - "UI answer state uses stable AnswerOption IDs."
          - "Submitting delegates correctness evaluation to AssessmentEngine rather than reimplementing scoring in the ViewModel."
          - "A submitted question cannot be edited after submission under the current MVP rules."
          - "The presentation exposes assessment progress based on actual selected question count."
          - "Moving between questions preserves submitted QuestionAttempt state."
          - "Updated in-progress TestAttempt state is persisted through AssessmentRepository at meaningful checkpoints."
          - "The final answered question leaves the session ready for explicit completion rather than silently creating a second scoring path."
          - "Focused ViewModel tests cover single-answer, multiple-answer, submission, progression, persistence, and failure states."
          - "Compose tests cover core answer-selection and progress behavior."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E09-04
        title: "Implement focused assessment completion and result review"

        issue: >
          Completing a focused assessment must produce a useful review experience
          rather than only a numeric score. Users need to understand mistakes,
          read explanations, and access the authoritative references bundled
          with each question.

        approach: >
          Complete the active AssessmentSession through AssessmentEngine, persist
          the completed TestAttempt, navigate using the stable attempt ID, and
          implement a result/review screen that reconstructs historical question
          content through AssessmentRepository plus CurriculumRepository.
          Present the overall score and per-question correctness, selected
          answers, correct answers, explanation, and authoritative sources.

        acceptance_criteria:
          - "An assessment can be explicitly completed once every question is answered."
          - "The completed TestAttempt is persisted before the result flow is treated as successful."
          - "Results display total questions, correct answers, and derived percentage."
          - "The result route uses stable attempt identity rather than carrying the full AssessmentSession."
          - "Historical Question content is resolved through CurriculumRepository.getQuestionById."
          - "Each reviewed question shows the user's selected answer identities mapped to answer content."
          - "Each reviewed question distinguishes correct and incorrect selections clearly."
          - "The authored correct answer or answers are visible during review."
          - "The authored explanation is displayed."
          - "All authoritative SourceReference entries are displayed in authored order."
          - "Source URLs can be opened using an appropriate multiplatform/platform boundary without embedding Android-only code in common UI."
          - "DEPRECATED questions remain reviewable through stable-ID lookup."
          - "Missing historical question content is handled explicitly rather than crashing."
          - "Focused tests cover completion, persistence, historical reconstruction, explanations, and source presentation."

        priority: "P1"
        size: "L"
        initial_status: "Backlog"


      - key: E09-05
        title: "Implement repeat focused practice flow"

        issue: >
          After reviewing a focused attempt, users need a direct way to practice
          the same scope again while preserving the completed attempt as history.

        approach: >
          Integrate AssessmentRetakeService into the focused result flow. Create a
          new assessment from the completed attempt's existing
          AssessmentConfig, navigate to the new AssessmentSession, and preserve
          the original result. Keep the E08 retake semantics unchanged: same
          configuration, fresh selection, new attempt identity, overlap allowed.

        acceptance_criteria:
          - "A completed focused result exposes a repeat-practice action."
          - "Repeat practice delegates to AssessmentRetakeService."
          - "The new TestAttempt has a different stable ID from the source attempt."
          - "The new attempt preserves the source AssessmentConfig."
          - "The new attempt begins IN_PROGRESS with unanswered QuestionAttempts."
          - "The newly created retake is already persisted before navigation into the new session."
          - "The original completed attempt remains unchanged and can still be reviewed."
          - "Fresh selection is used; exact question reuse is not required and overlap is allowed."
          - "SourceAttemptNotFound and NoEligibleQuestions outcomes are represented explicitly."
          - "No history-aware repetition avoidance or E10 balancing policy is added."
          - "Focused tests cover successful retake, preserved source result, no-content behavior, and new-session navigation."

        priority: "P1"
        size: "M"
        initial_status: "Backlog"


      - key: E09-06
        title: "Verify focused learning journey end to end"

        issue: >
          The complete focused-practice journey needs integration and UI
          verification before the richer mixed-interview experience is added.

        approach: >
          Exercise the real topic browser, subtopic selection, focused assessment
          engine, persistence, result reconstruction, explanation/source review,
          and repeat-practice behavior together. Add targeted Compose/UI and
          shared integration tests and remove remaining placeholder artifacts
          that are no longer part of the product.

        acceptance_criteria:
          - "A user can navigate from the application start destination to an ACTIVE topic."
          - "A user can browse populated subtopics."
          - "Topic-wide focused practice can be started."
          - "Subtopic-focused practice can be started."
          - "Single- and multiple-answer questions can be answered through the UI."
          - "Assessment progress and explicit completion work across the full flow."
          - "The completed attempt survives a repository round trip."
          - "Results show score, selected/correct answers, explanation, and sources."
          - "A source link action reaches the platform URL-opening boundary."
          - "Repeat practice creates a separate persisted attempt and enters a fresh session."
          - "The source attempt remains reviewable."
          - "No-content and missing-content states fail gracefully."
          - "The main focused flow is covered by shared integration and targeted Compose tests."
          - "Android assemble and normal CI checks pass."
          - "The resulting E09 UI consumes stable E08 boundaries without direct Room/DAO access."

        priority: "P2"
        size: "M"
        initial_status: "Backlog"


