name: Sync backlog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Validate and sync backlog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3

      # ------------------------------------------------------------
      # 1. Validate backlog.yml before making any GitHub changes
      # ------------------------------------------------------------
      - name: Validate backlog
        run: |
          python .github/project/validate_backlog.py \
            .github/project/backlog.yml

      # ------------------------------------------------------------
      # 2. Verify that the GitHub CLI installed on the runner
      #    supports the native parent/sub-issue functionality used
      #    by the synchronization script
      # ------------------------------------------------------------
      - name: Verify GitHub CLI capabilities
        run: |
          echo "GitHub CLI version:"
          gh --version

          echo "Checking native sub-issue support..."
          gh issue create --help | grep -q -- "--parent"

          echo "Required GitHub CLI capabilities are available."

      # ------------------------------------------------------------
      # 3. Synchronize backlog issues
      #
      #    Parent epics:
      #      - Create missing epics
      #      - Update existing epic titles and managed goals
      #      - Ensure the epic label is applied
      #      - Add epics to the GitHub Project
      #
      #    Child issues:
      #      - Create missing child issues
      #      - Reuse/update existing child issues
      #      - Establish native parent/sub-issue relationships
      #      - Add child issues to the GitHub Project
      #
      #    Removal from backlog.yml is intentionally non-destructive.
      # ------------------------------------------------------------
      - name: Synchronize backlog issues
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
        run: |
          python .github/project/sync_backlog.py \
            .github/project/backlog.yml

      # ------------------------------------------------------------
      # 4. Synchronize child-issue Project fields
      #
      #    Priority:
      #      Always synchronized from backlog.yml
      #
      #    Size:
      #      Always synchronized from backlog.yml
      #
      #    Status:
      #      Initialized once from initial_status.
      #      Existing workflow status is preserved on future runs.
      #
      #    Iteration:
      #      Never modified by backlog synchronization.
      #
      #    Parent epics themselves do not receive Priority, Size,
      #    or initial Status values from this step.
      # ------------------------------------------------------------
      - name: Synchronize Project fields
        env:
          GH_TOKEN: ${{ secrets.PROJECT_PAT }}
          PROJECT_TITLE: ${{ vars.PROJECT_TITLE }}
        run: |
          python .github/project/sync_project_fields.py \
            .github/project/backlog.yml