          - "A 20-question request uses the coverage-first balanced Mixed selection policy."
          - "Selected questions span the expected number of populated topics for the controlled fixture."
          - "Mixed and Focused flows use the same underlying AssessmentEngine and assessment-taking presentation."
          - "Single-answer and multiple-answer Questions work through the Mixed UI."
          - "Actual progress and explicit completion work through the full flow."
